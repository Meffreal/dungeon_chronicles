[alembic]
# Cesta k adresáři s migracemi (relativně k tomuto souboru)
script_location = alembic

# Šablona pro názvy souborů s migracemi
file_template = %%(rev)s_%%(slug)s

# Přidáme backend/ do sys.path při spuštění přes CLI
prepend_sys_path = .

# URL je nastaveno dynamicky v env.py z proměnné DATABASE_URL
# (zde záměrně prázdné — env.py to přepíše)
sqlalchemy.url =

# Oddělovač verzí (OS = platformě závislý)
version_path_separator = os

[post_write_hooks]
# Sem lze přidat black/isort formátování po vygenerování migrace
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
