<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Chain left arc -->
  <path d="M24 5 Q14 7 12 14" stroke="#7a6a5a" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2.5 2"/>
  <!-- Chain right arc -->
  <path d="M24 5 Q34 7 36 14" stroke="#7a6a5a" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="2.5 2"/>
  <!-- Chain clasp -->
  <circle cx="24" cy="5" r="2" fill="#221a14" stroke="#b89a6a" stroke-width="1"/>
  <!-- Outer gothic diamond frame -->
  <path d="M24 14 L30 20 L34 26 L30 30 L24 46 L18 30 L14 26 L18 20 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.5"/>
  <!-- Gothic arch point at top -->
  <path d="M24 14 L21 18 L24 16 L27 18 L24 14" fill="#b89a6a" stroke="#b89a6a" stroke-width="0.5"/>
  <!-- Inner gem bezel -->
  <path d="M24 19 L28 24 L24 29 L20 24 Z" fill="#0f0a0a" stroke="#b89a6a" stroke-width="1.2"/>
  <!-- Gem facets (blood red ruby) -->
  <path d="M24 19 L27 23 L24 27 L21 23 Z" fill="#7a2020" stroke="#9a3030" stroke-width="0.5" opacity="0.9"/>
  <line x1="24" y1="19" x2="24" y2="27" stroke="#2a0808" stroke-width="0.6" opacity="0.7"/>
  <line x1="20" y1="24" x2="28" y2="24" stroke="#2a0808" stroke-width="0.6" opacity="0.7"/>
  <!-- Gem highlight spark -->
  <path d="M22.5 20.5 L23.5 21.5" stroke="#ff9a7a" stroke-width="0.8" stroke-linecap="round" opacity="0.8"/>
  <!-- Pendant teardrop extension -->
  <path d="M20 30 Q18 36 24 46 Q30 36 28 30" fill="#150f0e" stroke="#7a6a5a" stroke-width="1"/>
  <!-- Side filigree flourishes -->
  <path d="M14 26 Q11 22 14 20" stroke="#b89a6a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <path d="M34 26 Q37 22 34 20" stroke="#b89a6a" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <!-- Small dots on side -->
  <circle cx="13" cy="26" r="1" fill="#b89a6a" opacity="0.5"/>
  <circle cx="35" cy="26" r="1" fill="#b89a6a" opacity="0.5"/>
</svg>
