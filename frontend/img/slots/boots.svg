<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Greave (shin guard) -->
  <path d="M16 3 L16 28 Q16 32 18 34 L30 34 Q32 32 32 28 L32 3 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.5"/>
  <!-- Greave center ridge -->
  <line x1="24" y1="3" x2="24" y2="28" stroke="#5a4a3a" stroke-width="0.9" opacity="0.6"/>
  <!-- Greave segment lines -->
  <line x1="16" y1="11" x2="32" y2="11" stroke="#5a4a3a" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="19" x2="32" y2="19" stroke="#5a4a3a" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="27" x2="32" y2="27" stroke="#5a4a3a" stroke-width="0.8" opacity="0.5"/>
  <!-- Gothic shin etch (arch motif) -->
  <path d="M21 5 L24 9 L27 5" stroke="#b89a6a" stroke-width="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Knee cop (rounded knee guard) -->
  <path d="M15 22 Q11 22 11 28 Q11 32 15 32 L16 32 L16 22 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.2"/>
  <path d="M32 22 Q36 22 36 28 Q36 32 32 32 L31 32 L31 22 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.2"/>
  <!-- Sabaton (foot plate) -->
  <path d="M14 34 Q12 36 13 41 Q16 45 26 45 Q36 43 38 39 Q38 35 34 34 L18 34 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.5"/>
  <!-- Gothic pointed toe -->
  <path d="M26 45 Q36 43 38 39 Q40 36 37 36 Q33 40 28 43 Z" fill="#150f0e" stroke="#7a6a5a" stroke-width="1"/>
  <!-- Sabaton segments -->
  <line x1="15" y1="37" x2="32" y2="37" stroke="#5a4a3a" stroke-width="0.8" opacity="0.5"/>
  <line x1="16" y1="41" x2="30" y2="41" stroke="#5a4a3a" stroke-width="0.8" opacity="0.5"/>
  <!-- Ankle buckle -->
  <rect x="20" y="31" width="8" height="4" rx="1" fill="#221a14" stroke="#b89a6a" stroke-width="0.9"/>
  <line x1="24" y1="31" x2="24" y2="35" stroke="#b89a6a" stroke-width="0.6"/>
  <!-- Buckle stud -->
  <circle cx="24" cy="33" r="0.8" fill="#b89a6a" opacity="0.8"/>
</svg>
