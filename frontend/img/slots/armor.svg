<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Left pauldron -->
  <path d="M8 15 Q9 10 16 12 L18 22 L8 20 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.3"/>
  <line x1="9" y1="14" x2="17" y2="16" stroke="#5a4a38" stroke-width="0.7" opacity="0.7"/>
  <!-- Right pauldron -->
  <path d="M40 15 Q39 10 32 12 L30 22 L40 20 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.3"/>
  <line x1="39" y1="14" x2="31" y2="16" stroke="#5a4a38" stroke-width="0.7" opacity="0.7"/>
  <!-- Main breastplate -->
  <path d="M16 12 Q24 8 32 12 L34 34 Q30 42 24 44 Q18 42 14 34 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.5"/>
  <!-- Center ridge -->
  <line x1="24" y1="12" x2="24" y2="40" stroke="#5a4a3a" stroke-width="1" opacity="0.6"/>
  <!-- Pectoral arc lines (gothic etching) -->
  <path d="M18 17 Q24 14 30 17" stroke="#b89a6a" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <path d="M17 23 Q24 20 31 23" stroke="#b89a6a" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  <!-- Gothic cross motif -->
  <path d="M24 20 L24 36 M20 27 L28 27" stroke="#7a2020" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <!-- Fauld (skirt plates) -->
  <path d="M15 34 L13 40 L18 43 L24 44 L30 43 L35 40 L33 34 Z" fill="#150f0e" stroke="#7a6a5a" stroke-width="1.2"/>
  <!-- Tasset segment lines -->
  <line x1="19" y1="36" x2="18" y2="43" stroke="#5a4a38" stroke-width="0.8" opacity="0.6"/>
  <line x1="24" y1="36" x2="24" y2="44" stroke="#5a4a38" stroke-width="0.8" opacity="0.6"/>
  <line x1="29" y1="36" x2="30" y2="43" stroke="#5a4a38" stroke-width="0.8" opacity="0.6"/>
  <!-- Gorget (collar) -->
  <path d="M17 12 Q24 9 31 12 L30 15 Q24 12 18 15 Z" fill="#221814" stroke="#b89a6a" stroke-width="0.8"/>
</svg>
