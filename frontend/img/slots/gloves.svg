  <ellipse cx="18.5" cy="22" rx="1.8" ry="1.4" fill="#221a14" stroke="#b89a6a" stroke-width="0.9"/>
  <ellipse cx="22.5" cy="22" rx="1.8" ry="1.4" fill="#221a14" stroke="#b89a6a" stroke-width="0.9"/>
  <ellipse cx="26.5" cy="22" rx="1.8" ry="1.4" fill="#221a14" stroke="#b89a6a" stroke-width="0.9"/>
  <!-- Wrist cuff -->
  <path d="M11 36 L35 36 L35 42 Q23 46 11 42 Z" fill="#150f0e" stroke="#7a6a5a" stroke-width="1.3"/>
