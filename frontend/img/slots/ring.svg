  <line x1="24" y1="15" x2="24" y2="23" stroke="#2a0808" stroke-width="0.5" opacity="0.6"/>
  <line x1="20.5" y1="17" x2="27.5" y2="17" stroke="#2a0808" stroke-width="0.5" opacity="0.6"/>
  <line x1="20" y1="21" x2="28" y2="21" stroke="#2a0808" stroke-width="0.5" opacity="0.6"/>
  <!-- Gem highlight -->
  <path d="M22.5 16 L23.5 17" stroke="#ffaa88" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>
  <!-- Gothic band ornament (center top) -->
  <path d="M21 24 Q24 26 27 24" stroke="#5a4a3a" stroke-width="0.7" opacity="0.7"/>
</svg>
