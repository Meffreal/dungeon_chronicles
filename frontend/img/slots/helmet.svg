<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Gothic crest spikes -->
  <path d="M18 10 L20 5 L22 9 L24 3 L26 9 L28 5 L30 10" stroke="#b89a6a" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Ear flares (pauldron wings) -->
  <path d="M13 26 L9 24 L9 30 L13 32" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.3"/>
  <path d="M35 26 L39 24 L39 30 L35 32" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.3"/>
  <!-- Main dome -->
  <path d="M13 28 C13 15 18 10 24 10 C30 10 35 15 35 28 L35 38 L13 38 Z" fill="#1a1412" stroke="#7a6a5a" stroke-width="1.5"/>
  <!-- Dome ridge -->
  <line x1="24" y1="10" x2="24" y2="28" stroke="#5a4a3a" stroke-width="0.8" opacity="0.7"/>
  <!-- Visor area (darker plate) -->
  <path d="M13 28 L35 28 L35 38 L13 38 Z" fill="#110e0d" stroke="#7a6a5a" stroke-width="1"/>
  <!-- Visor T-slot -->
  <line x1="16" y1="32" x2="22" y2="32" stroke="#b89a6a" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="26" y1="32" x2="32" y2="32" stroke="#b89a6a" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="28" x2="24" y2="38" stroke="#b89a6a" stroke-width="1" stroke-linecap="round"/>
  <!-- Dome highlight arc -->
  <path d="M18 16 Q20 13 24 12 Q28 13 30 16" stroke="#5a4a38" stroke-width="0.8" stroke-linecap="round" opacity="0.9"/>
  <!-- Neck guard arc -->
  <path d="M13 38 Q24 43 35 38" stroke="#7a6a5a" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Side rivets -->
  <circle cx="14" cy="20" r="1" fill="#b89a6a" opacity="0.7"/>
  <circle cx="34" cy="20" r="1" fill="#b89a6a" opacity="0.7"/>
</svg>
